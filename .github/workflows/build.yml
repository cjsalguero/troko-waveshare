name: Compilar Troko Next-Gen Tactil y Carrusel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Clonar codigo de XiaoZhi
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          git clone --depth 1 https://github.com/78/xiaozhi-esp32.git repo

      - name: Configurar pines, tactil CST816D y carrusel de 4 pantallas
        shell: bash
        run: |
          rm -f repo/main/boards/wk-esp32s3-dev/wk_board.cc
          cat << 'EOF' > repo/main/boards/wk-esp32s3-dev/config.h
          #ifndef _BOARD_CONFIG_H_
          #define _BOARD_CONFIG_H_

          #include <driver/gpio.h>

          #define AUDIO_INPUT_SAMPLE_RATE  16000
          #define AUDIO_OUTPUT_SAMPLE_RATE 24000

          #define AUDIO_I2S_METHOD_SIMPLEX

          // Microfono INMP441
          #define AUDIO_I2S_MIC_GPIO_WS   GPIO_NUM_11
          #define AUDIO_I2S_MIC_GPIO_SCK  GPIO_NUM_12
          #define AUDIO_I2S_MIC_GPIO_DIN  GPIO_NUM_15

          // Altavoz / Amplificador MAX98357A
          #define AUDIO_I2S_SPK_GPIO_DOUT GPIO_NUM_7
          #define AUDIO_I2S_SPK_GPIO_BCLK GPIO_NUM_4
          #define AUDIO_I2S_SPK_GPIO_LRCK GPIO_NUM_6

          // Boton BOOT
          #define BUILTIN_LED_GPIO        GPIO_NUM_NC
          #define BOOT_BUTTON_GPIO        GPIO_NUM_0
          #define TOUCH_BUTTON_GPIO       GPIO_NUM_NC
          #define VOLUME_UP_BUTTON_GPIO   GPIO_NUM_NC
          #define VOLUME_DOWN_BUTTON_GPIO GPIO_NUM_NC
          #define LAMP_GPIO               GPIO_NUM_NC

          // Pantalla Waveshare 2.0 pulgadas (ST7789)
          #define DISPLAY_BACKLIGHT_PIN   GPIO_NUM_1
          #define DISPLAY_MOSI_PIN        GPIO_NUM_38
          #define DISPLAY_CLK_PIN         GPIO_NUM_39
          #define DISPLAY_DC_PIN          GPIO_NUM_42
          #define DISPLAY_RST_PIN         GPIO_NUM_NC
          #define DISPLAY_CS_PIN          GPIO_NUM_45

          // Touch CST816D (I2C)
          #define TOUCH_I2C_SDA_PIN       GPIO_NUM_48
          #define TOUCH_I2C_SCL_PIN       GPIO_NUM_47
          #define TOUCH_INT_PIN           GPIO_NUM_46
          #define TOUCH_RST_PIN           GPIO_NUM_NC

          // Orientacion Horizontal (Panoramico 320x240 - USB Derecha)
          #define LCD_TYPE_ST7789_SERIAL
          #define DISPLAY_WIDTH           320
          #define DISPLAY_HEIGHT          240
          #define DISPLAY_MIRROR_X        false
          #define DISPLAY_MIRROR_Y        true
          #define DISPLAY_SWAP_XY         true
          #define DISPLAY_INVERT_COLOR    true
          #define DISPLAY_RGB_ORDER       LCD_RGB_ELEMENT_ORDER_RGB
          #define DISPLAY_OFFSET_X        0
          #define DISPLAY_OFFSET_Y        0
          #define DISPLAY_BACKLIGHT_OUTPUT_INVERT false
          #define DISPLAY_SPI_MODE        0

          #ifndef CONFIG_WK_ESP32S3_DEV_DISPLAY_LCD
          #define CONFIG_WK_ESP32S3_DEV_DISPLAY_LCD 1
          #endif
          #undef CONFIG_WK_ESP32S3_DEV_DISPLAY_OLED

          #endif
          EOF

          cat << 'EOF' > repo/main/boards/wk-esp32s3-dev/config.json
          {
              "type": "wk-esp32s3-dev",
              "target": "esp32s3",
              "builds": [
                  {
                      "name": "wk-esp32s3-dev",
                      "sdkconfig_append": [
                          "CONFIG_WK_ESP32S3_DEV_DISPLAY_LCD=y",
                          "CONFIG_LCD_ST7789_240X320=y",
                          "CONFIG_BOARD_NO_MOTOR_CONTROL=y",
                          "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y"
                      ]
                  }
              ]
          }
          EOF

          cat << 'EOF' > repo/main/boards/wk-esp32s3-dev/wk-esp32s3-dev.cc
          #include "wifi_board.h"
          #include "codecs/no_audio_codec.h"
          #include "display/lcd_display.h"
          #include "system_reset.h"
          #include "application.h"
          #include "button.h"
          #include "config.h"
          #include "mcp_server.h"
          #include "lamp_controller.h"
          #include "led/single_led.h"
          #include "assets/lang_config.h"

          #include <wifi_station.h>
          #include <esp_wifi.h>
          #include <esp_log.h>
          #include <driver/i2c_master.h>
          #include <esp_lcd_panel_vendor.h>
          #include <esp_lcd_panel_io.h>
          #include <esp_lcd_panel_ops.h>
          #include <driver/spi_common.h>
          #include <esp_lcd_touch_cst816s.h>
          #include <esp_lvgl_port.h>
          #include <lvgl.h>
          #include <time.h>
          #include <sys/time.h>
          #include <string>
          #include <cmath>

          #include <esp_adc/adc_oneshot.h>
          #include <esp_adc/adc_cali.h>
          #include <esp_adc/adc_cali_scheme.h>
          #include <esp_timer.h>

          #ifndef ESP_LCD_TOUCH_IO_I2C_CST816S_ADDRESS
          #define ESP_LCD_TOUCH_IO_I2C_CST816S_ADDRESS 0x15
          #endif

          #define TAG "TrokoWaveshare"

          LV_FONT_DECLARE(BUILTIN_TEXT_FONT);

          /**
           * TrokoDisplay: Pantalla única dedicada al rostro interactivo y reactivo de Troko.
           * Sin páginas accesorias (sin carrusel, sin reloj grande, sin pomodoro, sin listas de tareas).
           * La pantalla es 100% Troko con expresiones animadas, sincronización labial y widget discreto de batería.
           */
          class TrokoDisplay : public SpiLcdDisplay {
          private:
              lv_obj_t* battery_label_ = nullptr;
              lv_timer_t* tick_timer_ = nullptr;
              lv_timer_t* single_tap_timer_ = nullptr;
              int64_t last_tap_time_ms_ = 0;

          public:
              TrokoDisplay(esp_lcd_panel_io_handle_t panel_io, esp_lcd_panel_handle_t panel,
                           int width, int height, int offset_x, int offset_y,
                           bool mirror_x, bool mirror_y, bool swap_xy)
                  : SpiLcdDisplay(panel_io, panel, width, height, offset_x, offset_y, mirror_x, mirror_y, swap_xy) {}

              virtual void SetupUI() override {
                  SpiLcdDisplay::SetupUI();

                  DisplayLockGuard lock(this);
                  auto screen = lv_screen_active();

                  // 1. Indicador discreto de Batería en la esquina superior derecha
                  battery_label_ = lv_label_create(screen);
                  lv_label_set_text(battery_label_, "🔋 --%");
                  lv_obj_set_style_text_color(battery_label_, lv_color_hex(0xb5ff43), 0);
                  lv_obj_align(battery_label_, LV_ALIGN_TOP_RIGHT, -10, 6);
                  lv_obj_add_flag(battery_label_, LV_OBJ_FLAG_IGNORE_LAYOUT);

                  // 2. Hacer la pantalla completamente táctil para interactuar con Troko
                  lv_obj_add_flag(screen, LV_OBJ_FLAG_CLICKABLE);
                  if (container_ != nullptr) {
                      lv_obj_add_flag(container_, LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_add_flag(container_, LV_OBJ_FLAG_EVENT_BUBBLE);
                  }
                  if (content_ != nullptr) {
                      lv_obj_add_flag(content_, LV_OBJ_FLAG_EVENT_BUBBLE);
                  }
                  if (emoji_box_ != nullptr) {
                      lv_obj_add_flag(emoji_box_, LV_OBJ_FLAG_EVENT_BUBBLE);
                  }
                  if (emoji_image_ != nullptr) {
                      lv_obj_add_flag(emoji_image_, LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_add_flag(emoji_image_, LV_OBJ_FLAG_EVENT_BUBBLE);
                  }

                  // 3. Manejador de eventos táctiles:
                  //    - Toque simple: conmutar escucha (hablar o interrumpir)
                  //    - Doble toque rápido: guiño simpático
                  lv_obj_add_event_cb(screen, [](lv_event_t* e) {
                      auto self = static_cast<TrokoDisplay*>(lv_event_get_user_data(e));
                      lv_event_code_t code = lv_event_get_code(e);

                      if (code == LV_EVENT_CLICKED) {
                          int64_t now_ms = esp_timer_get_time() / 1000;
                          int64_t interval = now_ms - self->last_tap_time_ms_;
                          self->last_tap_time_ms_ = now_ms;

                          if (interval > 50 && interval < 380) {
                              // Doble toque rápido: Guiño de complicidad
                              if (self->single_tap_timer_) {
                                  lv_timer_delete(self->single_tap_timer_);
                                  self->single_tap_timer_ = nullptr;
                              }
                              self->SetEmotion("winking");
                          } else {
                              // Toque simple: esperar 350 ms y conmutar diálogo
                              if (self->single_tap_timer_) {
                                  lv_timer_delete(self->single_tap_timer_);
                                  self->single_tap_timer_ = nullptr;
                              }
                              self->single_tap_timer_ = lv_timer_create([](lv_timer_t* t) {
                                  auto self = static_cast<TrokoDisplay*>(lv_timer_get_user_data(t));
                                  lv_timer_delete(t);
                                  self->single_tap_timer_ = nullptr;
                                  auto& app = Application::GetInstance();
                                  app.ToggleChatState();
                              }, 350, self);
                          }
                      }
                  }, LV_EVENT_ALL, this);

                  // 4. Timer periódico de actualización de batería cada segundo
                  tick_timer_ = lv_timer_create([](lv_timer_t* t) {
                      auto self = static_cast<TrokoDisplay*>(lv_timer_get_user_data(t));
                      self->OnTimerTick();
                  }, 1000, this);
              }

              void OnTimerTick() {
                  int level = 100;
                  bool charging = false, discharging = false;
                  if (Board::GetInstance().GetBatteryLevel(level, charging, discharging)) {
                      char b_str[32];
                      if (charging) {
                          snprintf(b_str, sizeof(b_str), "⚡ %d%%", level);
                          if (battery_label_) lv_obj_set_style_text_color(battery_label_, lv_color_hex(0xffcc00), 0);
                      } else if (level <= 20) {
                          snprintf(b_str, sizeof(b_str), "🪫 %d%%", level);
                          if (battery_label_) lv_obj_set_style_text_color(battery_label_, lv_color_hex(0xff4444), 0);
                      } else {
                          snprintf(b_str, sizeof(b_str), "🔋 %d%%", level);
                          if (battery_label_) lv_obj_set_style_text_color(battery_label_, lv_color_hex(0xb5ff43), 0);
                      }
                      if (battery_label_) lv_label_set_text(battery_label_, b_str);
                  }
              }
          };

          /**
           * WkEsp32s3Dev: Implementación de la placa Waveshare ESP32-S3-Touch-LCD-2
           */
          class WkEsp32s3Dev : public WifiBoard {
          private:
              Button boot_button_;
              Display* display_ = nullptr;
              i2c_master_bus_handle_t i2c_bus_ = nullptr;
              i2c_master_dev_handle_t qmi_dev_ = nullptr;
              bool qmi_initialized_ = false;
              esp_lcd_panel_io_handle_t panel_io_ = nullptr;
              esp_lcd_panel_handle_t panel_ = nullptr;
              lv_indev_t* touch_indev_ = nullptr;
              Button volume_up_button_;
              Button volume_down_button_;

              // Telemetría ADC de Batería (GPIO 5, divisor 200k/100k)
              adc_oneshot_unit_handle_t adc1_handle_ = nullptr;
              adc_cali_handle_t adc_cali_handle_ = nullptr;
              bool adc_cali_enabled_ = false;

              // Control de IMU y Estados
              int64_t last_shake_time_ms_ = 0;
              bool privacy_mode_active_ = false;

              void InitializeBatteryAdc() {
                  adc_oneshot_unit_init_cfg_t init_config1 = {
                      .unit_id = ADC_UNIT_1,
                      .ulp_mode = ADC_ULP_MODE_DISABLE,
                  };
                  ESP_ERROR_CHECK(adc_oneshot_new_unit(&init_config1, &adc1_handle_));

                  adc_oneshot_chan_cfg_t config = {
                      .atten = ADC_ATTEN_DB_12,
                      .bitwidth = ADC_BITWIDTH_DEFAULT,
                  };
                  // GPIO 5 = ADC1 Channel 4
                  ESP_ERROR_CHECK(adc_oneshot_config_channel(adc1_handle_, ADC_CHANNEL_4, &config));

                  adc_cali_curve_fitting_config_t cali_config = {
                      .unit_id = ADC_UNIT_1,
                      .chan = ADC_CHANNEL_4,
                      .atten = ADC_ATTEN_DB_12,
                      .bitwidth = ADC_BITWIDTH_DEFAULT,
                  };
                  if (adc_cali_create_scheme_curve_fitting(&cali_config, &adc_cali_handle_) == ESP_OK) {
                      adc_cali_enabled_ = true;
                      ESP_LOGI(TAG, "ADC Bateria calibrado con exito");
                  } else {
                      ESP_LOGW(TAG, "Calibracion ADC curve-fitting no disponible, usando lineal");
                  }
              }

              int ReadBatteryVoltageMv() {
                  if (!adc1_handle_) return 0;
                  int raw = 0;
                  int sum_raw = 0;
                  for (int i = 0; i < 8; i++) {
                      adc_oneshot_read(adc1_handle_, ADC_CHANNEL_4, &raw);
                      sum_raw += raw;
                  }
                  int avg_raw = sum_raw / 8;
                  int voltage_mv = 0;
                  if (adc_cali_enabled_ && adc_cali_handle_) {
                      adc_cali_raw_to_voltage(adc_cali_handle_, avg_raw, &voltage_mv);
                  } else {
                      voltage_mv = (avg_raw * 3100) / 4095;
                  }
                  // Multiplicador 3.0 por divisor R19=200k, R20=100k
                  return voltage_mv * 3;
              }

              int CalculateBatteryPercentage(int vbat_mv) {
                  if (vbat_mv >= 4180) return 100;
                  if (vbat_mv <= 3300) return 0;
                  struct VoltPct { int mv; int pct; };
                  static const VoltPct curve[] = {
                      {4180, 100}, {4050, 90}, {3950, 80}, {3850, 70},
                      {3780, 60}, {3730, 50}, {3680, 40}, {3630, 30},
                      {3580, 20}, {3500, 10}, {3300, 0}
                  };
                  for (size_t i = 0; i < sizeof(curve)/sizeof(curve[0]) - 1; i++) {
                      if (vbat_mv >= curve[i+1].mv) {
                          int span_mv = curve[i].mv - curve[i+1].mv;
                          int span_pct = curve[i].pct - curve[i+1].pct;
                          int offset = vbat_mv - curve[i+1].mv;
                          return curve[i+1].pct + (offset * span_pct) / span_mv;
                      }
                  }
                  return 0;
              }

              void InitializeQmi8658() {
                  if (!i2c_bus_) return;

                  i2c_device_config_t dev_cfg = {
                      .dev_addr_length = I2C_ADDR_BIT_LEN_7,
                      .device_address = 0x6B,
                      .scl_speed_hz = 100000,
                  };
                  esp_err_t err = i2c_master_bus_add_device(i2c_bus_, &dev_cfg, &qmi_dev_);
                  if (err != ESP_OK) {
                      ESP_LOGW(TAG, "QMI8658 add device failed: %s", esp_err_to_name(err));
                      return;
                  }

                  uint8_t reg_who = 0x00;
                  uint8_t who_val = 0;
                  err = i2c_master_transmit_receive(qmi_dev_, &reg_who, 1, &who_val, 1, 100);
                  if (err != ESP_OK || who_val != 0x05) {
                      i2c_master_bus_rm_device(qmi_dev_);
                      dev_cfg.device_address = 0x6A;
                      if (i2c_master_bus_add_device(i2c_bus_, &dev_cfg, &qmi_dev_) == ESP_OK) {
                          err = i2c_master_transmit_receive(qmi_dev_, &reg_who, 1, &who_val, 1, 100);
                      }
                  }

                  if (err == ESP_OK && who_val == 0x05) {
                      ESP_LOGI(TAG, "QMI8658 detectado (whoami = 0x%02x)", who_val);
                      uint8_t c1[2] = {0x02, 0x60}; // CTRL1: auto-increment
                      i2c_master_transmit(qmi_dev_, c1, 2, 100);
                      uint8_t c2[2] = {0x03, 0x23}; // CTRL2: Acc +/- 4g, 100Hz
                      i2c_master_transmit(qmi_dev_, c2, 2, 100);
                      uint8_t c3[2] = {0x04, 0x43}; // CTRL3: Gyro +/- 512dps, 100Hz
                      i2c_master_transmit(qmi_dev_, c3, 2, 100);
                      uint8_t c7[2] = {0x08, 0x03}; // CTRL7: Enable Acc & Gyro
                      i2c_master_transmit(qmi_dev_, c7, 2, 100);
                      qmi_initialized_ = true;
                  } else {
                      ESP_LOGW(TAG, "QMI8658 IMU no responde, continuando sin sensor de movimiento.");
                  }
              }

              bool ReadImu(float &ax, float &ay, float &az) {
                  if (!qmi_initialized_ || !qmi_dev_) return false;
                  uint8_t reg = 0x35;
                  uint8_t buf[6] = {0};
                  esp_err_t err = i2c_master_transmit_receive(qmi_dev_, &reg, 1, buf, 6, 50);
                  if (err != ESP_OK) return false;

                  int16_t rx = (int16_t)(buf[1] << 8 | buf[0]);
                  int16_t ry = (int16_t)(buf[3] << 8 | buf[2]);
                  int16_t rz = (int16_t)(buf[5] << 8 | buf[4]);

                  ax = rx / 4096.0f;
                  ay = ry / 4096.0f;
                  az = rz / 4096.0f;
                  return true;
              }

              void StartImuTask() {
                  if (!qmi_initialized_) return;

                  xTaskCreate([](void* arg) {
                      auto self = static_cast<WkEsp32s3Dev*>(arg);
                      int face_down_count = 0;
                      int upright_count = 0;

                      while (true) {
                          vTaskDelay(pdMS_TO_TICKS(100));

                          float ax = 0, ay = 0, az = 0;
                          if (!self->ReadImu(ax, ay, az)) continue;

                          float mag = std::sqrt(ax * ax + ay * ay + az * az);
                          int64_t now_ms = esp_timer_get_time() / 1000;

                          // 1. Detección de sacudida (Mareo / Confusión)
                          if (mag > 1.85f || (mag < 0.25f && mag > 0.01f)) {
                              if (now_ms - self->last_shake_time_ms_ > 4000) {
                                  self->last_shake_time_ms_ = now_ms;
                                  ESP_LOGI(TAG, "Troko sacudido! Activando mareo.");
                                  if (self->display_) {
                                      self->display_->SetEmotion("confused");
                                  }
                              }
                          }

                          // 2. Modo Privacidad (Boca abajo / pantalla contra la mesa -> apagar pantalla)
                          // Al estar la pantalla y el PCB juntos con el sensor QMI8658 en el reverso,
                          // cuando Troko está boca abajo (pantalla contra la mesa), az es positivo (> 0.70f).
                          // Cuando está en posición normal (boca arriba o de pie), az es negativo o cercano a 0 (az < 0.30f).
                          if (az > 0.70f) {
                              face_down_count++;
                              upright_count = 0;
                              if (face_down_count >= 4 && !self->privacy_mode_active_) {
                                  self->privacy_mode_active_ = true;
                                  ESP_LOGI(TAG, "Modo Privacidad Activado (Boca Abajo: az=%.2f)", az);
                                  if (self->GetBacklight()) {
                                      self->GetBacklight()->SetBrightness(0);
                                  }
                              }
                          } else if (az < 0.30f) {
                              upright_count++;
                              face_down_count = 0;
                              if (upright_count >= 3 && self->privacy_mode_active_) {
                                  self->privacy_mode_active_ = false;
                                  ESP_LOGI(TAG, "Modo Privacidad Desactivado (Posición normal: az=%.2f)", az);
                                  if (self->GetBacklight()) {
                                      self->GetBacklight()->RestoreBrightness();
                                  }
                                  if (self->display_) {
                                      self->display_->SetEmotion("happy");
                                  }
                              }
                          } else {
                              face_down_count = 0;
                              upright_count = 0;
                          }
                      }
                  }, "troko_imu", 3072, this, 1, nullptr);
              }

              void InitializeI2c() {
                  i2c_master_bus_config_t i2c_bus_cfg = {
                      .i2c_port = (i2c_port_t)0,
                      .sda_io_num = TOUCH_I2C_SDA_PIN,
                      .scl_io_num = TOUCH_I2C_SCL_PIN,
                      .clk_source = I2C_CLK_SRC_DEFAULT,
                      .glitch_ignore_cnt = 7,
                      .intr_priority = 0,
                      .trans_queue_depth = 0,
                      .flags = {
                          .enable_internal_pullup = 1,
                      },
                  };
                  esp_err_t err = i2c_new_master_bus(&i2c_bus_cfg, &i2c_bus_);
                  if (err != ESP_OK) {
                      ESP_LOGE(TAG, "Fallo al inicializar bus I2C: %s", esp_err_to_name(err));
                  } else {
                      ESP_LOGI(TAG, "Bus I2C inicializado (SDA: 48, SCL: 47)");
                  }
              }

              void InitializeTouch() {
                  if (!i2c_bus_) return;

                  vTaskDelay(pdMS_TO_TICKS(50));

                  esp_lcd_touch_handle_t touch_handle = nullptr;
                  esp_lcd_panel_io_handle_t tp_io_handle = nullptr;

                  esp_lcd_panel_io_i2c_config_t tp_io_config = {};
                  tp_io_config.dev_addr = ESP_LCD_TOUCH_IO_I2C_CST816S_ADDRESS;
                  tp_io_config.scl_speed_hz = 100000;
                  tp_io_config.control_phase_bytes = 1;
                  tp_io_config.dc_bit_offset = 0;
                  tp_io_config.lcd_cmd_bits = 8;
                  tp_io_config.lcd_param_bits = 0;
                  tp_io_config.flags.disable_control_phase = 1;

                  esp_err_t ret = esp_lcd_new_panel_io_i2c(i2c_bus_, &tp_io_config, &tp_io_handle);
                  if (ret != ESP_OK) {
                      ESP_LOGE(TAG, "Fallo al crear panel IO táctil: %s", esp_err_to_name(ret));
                      return;
                  }

                  esp_lcd_touch_config_t tp_cfg = {
                      .x_max = DISPLAY_WIDTH,
                      .y_max = DISPLAY_HEIGHT,
                      .rst_gpio_num = GPIO_NUM_NC,
                      .int_gpio_num = TOUCH_INT_PIN,
                      .flags = {
                          .swap_xy = 1,
                          .mirror_x = 0,
                          .mirror_y = 1,
                      },
                  };
                  ESP_LOGI(TAG, "Inicializando controlador táctil CST816D...");
                  ret = esp_lcd_touch_new_i2c_cst816s(tp_io_handle, &tp_cfg, &touch_handle);
                  if (ret == ESP_OK) {
                      const lvgl_port_touch_cfg_t touch_cfg = {
                          .disp = lv_display_get_default(),
                          .handle = touch_handle,
                      };
                      touch_indev_ = lvgl_port_add_touch(&touch_cfg);
                      ESP_LOGI(TAG, "Táctil CST816D listo y registrado en LVGL!");
                  } else {
                      ESP_LOGE(TAG, "Fallo al inicializar CST816D: %s", esp_err_to_name(ret));
                  }
              }

              void InitializeSpi() {
                  spi_bus_config_t buscfg = {};
                  buscfg.mosi_io_num = DISPLAY_MOSI_PIN;
                  buscfg.miso_io_num = GPIO_NUM_NC;
                  buscfg.sclk_io_num = DISPLAY_CLK_PIN;
                  buscfg.quadwp_io_num = GPIO_NUM_NC;
                  buscfg.quadhd_io_num = GPIO_NUM_NC;
                  buscfg.max_transfer_sz = DISPLAY_WIDTH * DISPLAY_HEIGHT * sizeof(uint16_t);
                  ESP_ERROR_CHECK(spi_bus_initialize(SPI3_HOST, &buscfg, SPI_DMA_CH_AUTO));
              }

              void InitializeLcdDisplay() {
                  esp_lcd_panel_io_spi_config_t io_config = {};
                  io_config.cs_gpio_num = DISPLAY_CS_PIN;
                  io_config.dc_gpio_num = DISPLAY_DC_PIN;
                  io_config.spi_mode = DISPLAY_SPI_MODE;
                  io_config.pclk_hz = 40 * 1000 * 1000;
                  io_config.trans_queue_depth = 10;
                  io_config.lcd_cmd_bits = 8;
                  io_config.lcd_param_bits = 8;

                  ESP_ERROR_CHECK(esp_lcd_new_panel_io_spi(SPI3_HOST, &io_config, &panel_io_));

                  esp_lcd_panel_dev_config_t panel_config = {};
                  panel_config.reset_gpio_num = DISPLAY_RST_PIN;
                  panel_config.rgb_ele_order = DISPLAY_RGB_ORDER;
                  panel_config.bits_per_pixel = 16;

                  ESP_ERROR_CHECK(esp_lcd_new_panel_st7789(panel_io_, &panel_config, &panel_));
                  ESP_ERROR_CHECK(esp_lcd_panel_reset(panel_));
                  ESP_ERROR_CHECK(esp_lcd_panel_init(panel_));
                  ESP_ERROR_CHECK(esp_lcd_panel_invert_color(panel_, DISPLAY_INVERT_COLOR));
                  ESP_ERROR_CHECK(esp_lcd_panel_swap_xy(panel_, DISPLAY_SWAP_XY));
                  ESP_ERROR_CHECK(esp_lcd_panel_mirror(panel_, DISPLAY_MIRROR_X, DISPLAY_MIRROR_Y));

                  display_ = new TrokoDisplay(panel_io_, panel_,
                                              DISPLAY_WIDTH,
                                              DISPLAY_HEIGHT,
                                              DISPLAY_OFFSET_X,
                                              DISPLAY_OFFSET_Y,
                                              DISPLAY_MIRROR_X,
                                              DISPLAY_MIRROR_Y,
                                              DISPLAY_SWAP_XY);
              }

              void InitializeButtons() {
                  boot_button_.OnClick([this]() {
                      auto& app = Application::GetInstance();
                      if (app.GetDeviceState() == kDeviceStateStarting) {
                          EnterWifiConfigMode();
                          return;
                      }
                      app.ToggleChatState();
                  });

                  volume_up_button_.OnClick([this]() {
                      auto codec = GetAudioCodec();
                      auto volume = codec->output_volume() + 10;
                      if (volume > 100) volume = 100;
                      codec->SetOutputVolume(volume);
                      GetDisplay()->ShowNotification(Lang::Strings::VOLUME + std::to_string(volume));
                  });

                  volume_up_button_.OnLongPress([this]() {
                      GetAudioCodec()->SetOutputVolume(100);
                      GetDisplay()->ShowNotification(Lang::Strings::MAX_VOLUME);
                  });

                  volume_down_button_.OnClick([this]() {
                      auto codec = GetAudioCodec();
                      auto volume = codec->output_volume() - 10;
                      if (volume < 0) volume = 0;
                      codec->SetOutputVolume(volume);
                      GetDisplay()->ShowNotification(Lang::Strings::VOLUME + std::to_string(volume));
                  });

                  volume_down_button_.OnLongPress([this]() {
                      GetAudioCodec()->SetOutputVolume(0);
                      GetDisplay()->ShowNotification(Lang::Strings::MUTED);
                  });
              }

              void InitializeTools() {
                  static LampController lamp(LAMP_GPIO);
              }

          public:
              WkEsp32s3Dev() :
                  boot_button_(BOOT_BUTTON_GPIO),
                  volume_up_button_(VOLUME_UP_BUTTON_GPIO),
                  volume_down_button_(VOLUME_DOWN_BUTTON_GPIO) {

                  InitializeI2c();
                  InitializeQmi8658();
                  InitializeSpi();
                  InitializeLcdDisplay();
                  InitializeTouch();
                  InitializeBatteryAdc();
                  StartImuTask();

                  if (DISPLAY_BACKLIGHT_PIN != GPIO_NUM_NC) {
                      GetBacklight()->RestoreBrightness();
                  }
                  InitializeButtons();
                  InitializeTools();
              }

              virtual Led* GetLed() override {
                  static SingleLed led(BUILTIN_LED_GPIO);
                  return &led;
              }

              virtual AudioCodec* GetAudioCodec() override {
          #ifdef AUDIO_I2S_METHOD_SIMPLEX
                  static NoAudioCodecSimplex audio_codec(AUDIO_INPUT_SAMPLE_RATE, AUDIO_OUTPUT_SAMPLE_RATE,
                      AUDIO_I2S_SPK_GPIO_BCLK, AUDIO_I2S_SPK_GPIO_LRCK, AUDIO_I2S_SPK_GPIO_DOUT, I2S_STD_SLOT_RIGHT,
                      AUDIO_I2S_MIC_GPIO_SCK, AUDIO_I2S_MIC_GPIO_WS, AUDIO_I2S_MIC_GPIO_DIN, I2S_STD_SLOT_LEFT);
          #else
                  static NoAudioCodecDuplex audio_codec(AUDIO_INPUT_SAMPLE_RATE, AUDIO_OUTPUT_SAMPLE_RATE,
                      AUDIO_I2S_GPIO_BCLK, AUDIO_I2S_GPIO_WS, AUDIO_I2S_GPIO_DOUT, AUDIO_I2S_GPIO_DIN);
          #endif
                  return &audio_codec;
              }

              virtual Display* GetDisplay() override {
                  return display_;
              }

              virtual Backlight* GetBacklight() override {
                  if (DISPLAY_BACKLIGHT_PIN != GPIO_NUM_NC) {
                      static PwmBacklight backlight(DISPLAY_BACKLIGHT_PIN, DISPLAY_BACKLIGHT_OUTPUT_INVERT);
                      return &backlight;
                  }
                  return nullptr;
              }

              virtual bool GetBatteryLevel(int &level, bool& charging, bool& discharging) override {
                  int vbat_mv = ReadBatteryVoltageMv();
                  if (vbat_mv <= 0) {
                      return false;
                  }
                  level = CalculateBatteryPercentage(vbat_mv);
                  charging = (vbat_mv > 4250);
                  discharging = !charging;
                  return true;
              }

              virtual void StartNetwork() override {
                  WifiBoard::StartNetwork();

                  // Optimización agresiva de Wi-Fi:
                  // 1. Desactivar modo de ahorro de energía (modem sleep) para eliminar jitter, latencia y cortes de audio en tiempo real
                  esp_wifi_set_ps(WIFI_PS_NONE);

                  // 2. Elevar potencia de transmisión RF al máximo físico de 21 dBm (84 en pasos de 0.25 dBm)
                  esp_wifi_set_max_tx_power(84);

                  int8_t tx_power = 0;
                  esp_wifi_get_max_tx_power(&tx_power);
                  ESP_LOGI(TAG, "Wi-Fi optimizado: PS=NONE (rendimiento máximo), Max TX Power=%d (%.2f dBm)", tx_power, tx_power * 0.25f);
              }

              virtual void SetPowerSaveLevel(PowerSaveLevel level) override {
                  // Bloquear modo de bajo consumo en Wi-Fi: forzar siempre PERFORMANCE para evitar desconexiones y jitter de audio
                  WifiBoard::SetPowerSaveLevel(PowerSaveLevel::PERFORMANCE);
                  esp_wifi_set_ps(WIFI_PS_NONE);
              }
          };

          DECLARE_BOARD(WkEsp32s3Dev);
          EOF

      - name: Compilar Firmware
        shell: bash
        working-directory: repo
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py wk-esp32s3-dev --name wk-esp32s3-dev --language es-ES

      - name: Subir binario compilado
        uses: actions/upload-artifact@v4
        with:
          name: troko_nextgen_touch_firmware
          path: repo/build/merged-binary.bin
