name: Compilar Troko Waveshare Panoramico

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Clonar codigo de XiaoZhi
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          git clone --depth 1 https://github.com/78/xiaozhi-esp32.git repo

      - name: Configurar pines y orientacion horizontal (USB Derecha)
        shell: bash
        run: |
          cat << 'EOF' > repo/main/boards/wk-esp32s3-dev/config.h
          #ifndef _BOARD_CONFIG_H_
          #define _BOARD_CONFIG_H_

          #include <driver/gpio.h>

          #define AUDIO_INPUT_SAMPLE_RATE  16000
          #define AUDIO_OUTPUT_SAMPLE_RATE 24000

          #define AUDIO_I2S_METHOD_SIMPLEX

          // Microfono INMP441
          #define AUDIO_I2S_MIC_GPIO_WS   GPIO_NUM_11
          #define AUDIO_I2S_MIC_GPIO_SCK  GPIO_NUM_12
          #define AUDIO_I2S_MIC_GPIO_DIN  GPIO_NUM_15

          // Altavoz / Amplificador MAX98357A
          #define AUDIO_I2S_SPK_GPIO_DOUT GPIO_NUM_7
          #define AUDIO_I2S_SPK_GPIO_BCLK GPIO_NUM_4
          #define AUDIO_I2S_SPK_GPIO_LRCK GPIO_NUM_6

          // Boton BOOT
          #define BUILTIN_LED_GPIO        GPIO_NUM_NC
          #define BOOT_BUTTON_GPIO        GPIO_NUM_0
          #define TOUCH_BUTTON_GPIO       GPIO_NUM_NC
          #define VOLUME_UP_BUTTON_GPIO   GPIO_NUM_NC
          #define VOLUME_DOWN_BUTTON_GPIO GPIO_NUM_NC
          #define LAMP_GPIO               GPIO_NUM_NC

          // Pantalla Waveshare 2.0 pulgadas (ST7789)
          #define DISPLAY_BACKLIGHT_PIN   GPIO_NUM_1
          #define DISPLAY_MOSI_PIN        GPIO_NUM_38
          #define DISPLAY_CLK_PIN         GPIO_NUM_39
          #define DISPLAY_DC_PIN          GPIO_NUM_42
          #define DISPLAY_RST_PIN         GPIO_NUM_NC
          #define DISPLAY_CS_PIN          GPIO_NUM_45

          // Orientacion Horizontal (Panoramico 320x240 - USB Derecha)
          #define LCD_TYPE_ST7789_SERIAL
          #define DISPLAY_WIDTH           320
          #define DISPLAY_HEIGHT          240
          #define DISPLAY_MIRROR_X        false
          #define DISPLAY_MIRROR_Y        true
          #define DISPLAY_SWAP_XY         true
          #define DISPLAY_INVERT_COLOR    true
          #define DISPLAY_RGB_ORDER       LCD_RGB_ELEMENT_ORDER_RGB
          #define DISPLAY_OFFSET_X        0
          #define DISPLAY_OFFSET_Y        0
          #define DISPLAY_BACKLIGHT_OUTPUT_INVERT false
          #define DISPLAY_SPI_MODE        0

          #endif
          EOF

          cat << 'EOF' > repo/main/boards/wk-esp32s3-dev/config.json
          {
              "target": "esp32s3",
              "builds": [
                  {
                      "name": "wk-esp32s3-dev",
                      "sdkconfig_append": [
                          "CONFIG_WK_ESP32S3_DEV_DISPLAY_LCD=y",
                          "CONFIG_LCD_ST7789_240X320=y",
                          "CONFIG_LANGUAGE_ES_ES=y",
                          "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y"
                      ]
                  }
              ]
          }
          EOF

      - name: Compilar
        shell: bash
        working-directory: repo
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py wk-esp32s3-dev --name wk-esp32s3-dev

      - name: Subir Firmware
        uses: actions/upload-artifact@v4
        with:
          name: troko-horizontal-firmware
          path: repo/build/merged-binary.bin
